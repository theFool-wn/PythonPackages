[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-messager"
version = "0.2.0"
description = "Configurable WeCom application message sender"
authors = [{name = "WangNan", email = "me@wangnan.net"}]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["requests[socks]>=2.28,<3", "urllib3>=1.26,<3"]

[project.scripts]
WeComMessager = "WeComMessager.cli:main"

[project.urls]
Homepage = "https://github.com/theFool-wn/PythonPackages/tree/main/wecom-messager"
Repository = "https://github.com/theFool-wn/PythonPackages"
Issues = "https://github.com/theFool-wn/PythonPackages/issues"

[tool.setuptools.packages.find]
where = ["src"]
