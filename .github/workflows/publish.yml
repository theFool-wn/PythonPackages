name: Publish a Python package to PyPI
"on":
    workflow_dispatch:
        inputs:
            package:
                description: Package to publish
                required: true
                type: choice
                options:
                    - wecom-messager
                    - buaa-network-autologin
permissions:
    contents: read
concurrency:
    group: publish-${{ inputs.package }}
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v6
                with:
                    persist-credentials: false
            -
                uses: actions/setup-python@v6
                with:
                    python-version: "3.11"
            -
                name: Check Python syntax without running the packages
                env:
                    PACKAGE_DIR: ${{ inputs.package }}
                run: |
                    python - <<'PY'
                    import ast
                    import os
                    from pathlib import Path

                    for source in Path(os.environ["PACKAGE_DIR"]).rglob("*.py"):
                        ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
                    PY
            -
                name: Check selected package version
                env:
                    PACKAGE_DIR: ${{ inputs.package }}
                run: |
                    python scripts/version.py --package "$PACKAGE_DIR" --check
            -
                name: Build and check distributions
                env:
                    PACKAGE_DIR: ${{ inputs.package }}
                run: |
                    python -m pip install --upgrade build twine
                    python -m build "$PACKAGE_DIR" --outdir dist
                    python -m twine check --strict dist/*
            -
                uses: actions/upload-artifact@v5
                with:
                    name: python-package-distributions
                    path: dist/
    publish:
        needs: build
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            -
                uses: actions/download-artifact@v5
                with:
                    name: python-package-distributions
                    path: dist/
            -
                name: Publish to PyPI
                uses: pypa/gh-action-pypi-publish@release/v1